<!DOCTYPE html>

<html lang="pt-br">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

</head>

<body>

    <div class="container">

        <div class="card text-center">
            <div class="row">
                <div class="col">1</div>
                <div class="col">
                    2
                    <form method="POST" action="/primeira_fase">
                        <textarea class="form-control mt-3 sqlbox" name="sql" rows="4"
                                    placeholder="Digite seu SQL aqui...">{{ sql or '' }}</textarea>
                        <button type="submit">Executar</button>
                    </form>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    3
                </div>
                <div class="col">4
                    {% if dados %}
                    <div class="tabela-container col-6">
                        <table class="table">
                            <thead>
                                <tr>
                                    {% for coluna in colunas %}
                                    <th>
                                        {{ coluna }}
                                    </th>
                                    {% endfor %}
                                </tr>
                            </thead>
                            <tbody>
                                {% for linha in dados %}
                                <tr>
                                    {% for valor in linha %}
                                    <td>
                                        {{ valor }}
                                    </td>
                                    {% endfor %}
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                    <a href="/segunda_fase">Próxima Fase</a>
                    {% endif %}
                </div>
                <div class="col">
                    {% if mensagem %}
                        {{mensagem}}
                    {% endif %}
                </div>
            </div>
        </div>

    </div>


</body>

</html>
