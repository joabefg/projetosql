<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Survive, QaroL.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="assets/logojogo.png" alt="Logo" width="50" height="44" class="d-inline-block align-text-top">
                Survive, QaroL.
            </a>
        </div>
    </nav>

    <div id="main-content">
        <div id="elementos-esquerda">
            <div id="container-cenario">
                <img src="/assets/BANHEIRO.png" alt="Banheiro">
            </div>
            <div id="container-player">
                <div id="container-imagem-player">
                    <img src="/assets/img_carol.jpg" alt="Carol" id="imagem-player">
                </div>
                <div id="container-opcoes-dialogo">
                    <div id="container-opcoes">Opção 1</div>
                    <div id="container-dialogo-player">Falas falas falas</div>
                </div>
            </div>
        </div>
        <div id="elementos-direita">
            <div id="container-npc">
                <div id="container-dialogo-npc">Falas falas falas</div>
                <div id="container-imagem-npc"><img src="assets/SPRITE SQL Lydia Normal.jpg" alt=""></div>
            </div>
            <div id="container-sql">
                <div id="container-tabela">
                    <table>
                        <tr>
                            <th>Person 1</th>
                            <th>Person 2</th>
                            <th>Person 3</th>
                        </tr>
                        <tr>
                            <td>Emil</td>
                            <td>Tobias</td>
                            <td>Linus</td>
                        </tr>
                        <tr>
                            <td>16</td>
                            <td>14</td>
                            <td>10</td>
                        </tr>
                    </table>
                </div>
                <div id="container-prompt">
                    <input type="text"  placeholder="SELECT * FROM banheiro;">
                </div>
            </div>
        </div>
    </div>

</body>

</html>
